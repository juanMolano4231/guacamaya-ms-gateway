services:
  gateway:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      AUTH_SERVICE_URL:      http://ms-auth:8080
      PRODUCTOS_SERVICE_URL: http://ms-productos:8082
      COMPRAS_SERVICE_URL:   http://ms-compras:8084
      ORDENES_SERVICE_URL:   http://ms-ordenes:8086
      PAGOS_SERVICE_URL:     http://ms-pagos:8080
      PROXY_TIMEOUT:         10000
      CORS_ORIGIN:           "*"
    networks:
      - guacamaya-net
    restart: unless-stopped

networks:
  guacamaya-net:
    external: true